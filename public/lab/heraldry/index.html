<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
<meta name="robots" content="noindex, follow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Algorithmic Heraldry — générateur</title>
    <meta name="description" content="Algorithmic Heraldry, le générateur de kerningkastle : des blasons écrits selon les règles de l'héraldique, chacun né d'une clé qui le redonne à l'identique. Tape ton prénom pour obtenir ton écu, partage-le par lien, exporte-le en SVG ou en PNG." />
    <link rel="canonical" href="https://kerningkastle.com/lab/heraldry/" />
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Conteneur principal du blason SVG -->
  <main id="container" role="main" aria-label="Zone d'affichage du blason vectoriel"></main>

  <nav id="tools" aria-label="Commandes">
    <button id="t-prev" title="Écu précédent (←)">←</button><button id="t-new" title="Nouvel écu (espace)">nouvel écu</button><button id="t-next" title="Écu suivant (→)">→</button>
    <span class="sep"></span>
    <button id="t-part" aria-pressed="false" title="Partitions (P)">partitions</button><button id="t-light" aria-pressed="false" title="Clair / sombre (L)">clair</button>
    <span class="sep"></span>
    <button id="t-link" title="Copier le lien de cet écu">lien</button><button id="t-svg" title="Exporter en SVG (S)">svg</button><button id="t-png" title="Exporter en PNG">png</button>
  </nav>
  <p id="who" aria-live="polite"></p>
  <!-- Interface minimale centrée -->
  <footer id="ui">
    <p id="blazon"></p>
    <div class="seed-line">
    [ <span id="seed-display">--------</span> ]
    </div>
    <div class="input-line">
      <input type="text" id="seed-input" spellcheck="false" autocomplete="off" placeholder="" aria-label="Saisir ou coller une seed">
      <button id="seed-submit" aria-label="Valider">
        <svg width="10" height="10" viewBox="0 0 10 10" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M9 1V5H2M2 5L5 2M2 5L5 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
    <div id="name-line"><input type="text" id="name-input" maxlength="40" spellcheck="false" autocomplete="off" placeholder="ton prénom, pour ton écu" aria-label="Ton prénom, pour obtenir ton écu"></div>
  </footer>

  <!-- Chargement des modules JavaScript -->
  <script type="module" src="src/main.js"></script>
  <script type="module" src="src/extras.js"></script>
<script src="/lab/back.js"></script>
</body>
</html>
