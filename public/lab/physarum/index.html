<!DOCTYPE html>
<html lang="fr" data-intro="Tape un mot : il pousse comme une culture. Dessine pour la nourrir (Maj pour gommer), glisse une image pour en faire le moule.">
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex, follow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lettres qui poussent — kerningkastle</title>
    <meta name="description" content="Lettres qui poussent : un automate cellulaire de kerningkastle qui fait pousser chaque lettre comme une culture. Tape une lettre, nourris la culture à la souris, dépose ta propre image, enregistre une image ou une vidéo. p5.js." />
    <link rel="canonical" href="https://kerningkastle.com/fr/lab/physarum/" />
    <link rel="stylesheet" href="/lab/ui.css">
    <link rel="stylesheet" href="style.css?v=3">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
</head>
<body>
    <main id="stage" aria-label="Une lettre qui pousse comme une culture de cellules"></main>
    <div class="kk-bar">
        <p class="hint">tape un mot · dessine pour nourrir · maj : gommer · glisse une image</p>
        <p class="act"><button id="render">rendu : trame</button><button id="pick">image</button><button id="invert">inverser</button><button id="save">enregistrer</button><button id="rec">vidéo 6 s</button></p>
        <input type="file" id="file" accept="image/*" hidden>
    </div>
    <p class="drop" aria-hidden="true">dépose l'image</p>
    <script src="/lab/back.js"></script>
    <script src="sketch.js?v=4"></script>
</body>
</html>
