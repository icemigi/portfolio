<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex, follow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lettres qui poussent — kerningkastle</title>
    <meta name="description" content="Lettres qui poussent : un automate cellulaire de kerningkastle qui fait pousser chaque lettre comme une culture. Tape une lettre, nourris la culture à la souris, dépose ta propre image, enregistre une image ou une vidéo. p5.js." />
    <link rel="canonical" href="https://kerningkastle.com/fr/lab/physarum/" />
    <link rel="stylesheet" href="style.css?v=2">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
</head>
<body>
    <main id="stage" aria-label="Une lettre qui pousse comme une culture de cellules"></main>
    <div class="bar">
        <p class="hint">tape une lettre · dessine pour nourrir · glisse une image</p>
        <p class="act"><button id="pick">image</button><button id="invert">inverser</button><button id="save">enregistrer</button><button id="rec">vidéo 6 s</button></p>
        <input type="file" id="file" accept="image/*" hidden>
    </div>
    <p class="drop" aria-hidden="true">dépose l'image</p>
    <script src="sketch.js?v=2"></script>
    <script src="/lab/back.js"></script>
</body>
</html>
